[build]
  publish = "."

# Old Squarespace URLs -> new pages (keeps Google rankings)
[[redirects]]
  from = "/our-services"
  to = "/services"
  status = 301
[[redirects]]
  from = "/contact-us"
  to = "/contact"
  status = 301
[[redirects]]
  from = "/resources"
  to = "/services"
  status = 301
[[redirects]]
  from = "/cart"
  to = "/"
  status = 301
[[redirects]]
  from = "https://www.thepethospitalto.com/*"
  to = "https://thepethospitalto.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
